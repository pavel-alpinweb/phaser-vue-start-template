backend:
  name: local

media_folder: "public/uploads"
public_folder: "/uploads"
local_backend: true

collections:
  - name: "localization"
    label: "Localization"
    files:
      - file: "src/configs/uiLocalization.json"
        label: "UI Localization"
        name: "ui_localization"
        format: "json"
        fields:
          - label: "Language Switcher Label"
            name: "language_label"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Russian", name: "ru", widget: "string" }
            
          - label: "Start Button Text"
            name: "start_button"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Russian", name: "ru", widget: "string" }

          - label: "Main Title (Charlie)"
            name: "main_title"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Russian", name: "ru", widget: "string" }

          - label: "Main Description"
            name: "main_description"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Russian", name: "ru", widget: "string" }

          - label: "Loading Text"
            name: "loading"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Russian", name: "ru", widget: "string" }

  - name: "gameplay"
    label: "Gameplay Config"
    files:
      - file: "src/content/configs/gameplay.json"
        label: "Gameplay"
        name: "gameplay"
        format: "json"
        fields:
          - { label: "PLAYER_SPEED", name: "PLAYER_SPEED", widget: "number" }
          - { label: "PLAYER_JUMP_MULTIPLICATOR", name: "PLAYER_JUMP_MULTIPLICATOR", widget: "number" }
          - { label: "PLAYER_FALL_MULTIPLICATOR", name: "PLAYER_FALL_MULTIPLICATOR", widget: "number" }
          - { label: "PLAYER_PLATFORM_BODY_WIDTH", name: "PLAYER_PLATFORM_BODY_WIDTH", widget: "number" }
          - { label: "PLAYER_PLATFORM_BODY_HEIGHT", name: "PLAYER_PLATFORM_BODY_HEIGHT", widget: "number" }
          - { label: "PLAYER_TOPDOWN_BODY_WIDTH", name: "PLAYER_TOPDOWN_BODY_WIDTH", widget: "number" }
          - { label: "PLAYER_TOPDOWN_BODY_HEIGHT", name: "PLAYER_TOPDOWN_BODY_HEIGHT", widget: "number" }
          - { label: "PLAYER_DISPLAY_WIDTH", name: "PLAYER_DISPLAY_WIDTH", widget: "number" }
          - { label: "PLAYER_DISPLAY_HEIGHT", name: "PLAYER_DISPLAY_HEIGHT", widget: "number" }
          - { label: "PLAYER_MAX_HEALTH", name: "PLAYER_MAX_HEALTH", widget: "number" }
          - { label: "PLAYER_CURRENT_HEALTH", name: "PLAYER_CURRENT_HEALTH", widget: "number" }
          - { label: "HEAL_VALUE", name: "HEAL_VALUE", widget: "number" }
          - { label: "BOMB_DAMAGE", name: "BOMB_DAMAGE", widget: "number" }
          
  - name: "vfx"
    label: "VFX Config"
    files:
      - file: "src/configs/particles.json"
        label: "Particles Effects"
        name: "particles"
        format: "json"
        fields:
          - label: "Visual Effects List"
            name: "VFX"
            widget: "object"
            fields:
              - label: "Dust Effect (Wheels)"
                name: "dust"
                widget: "object"
                fields:
                  - { label: "Texture Key (Имя ассета частицы)", name: "textureKey", widget: "string" }
                  - { label: "Size Px (Базовый размер в пикселях)", name: "particleSizePx", widget: "number" }
                  - { label: "Depth Offset (Слой относительно объекта: -1 сзади, 1 спереди)", name: "depthOffset", widget: "number" }
                  - { label: "Offset X (Смещение по горизонтали)", name: "followOffsetX", widget: "number" }
                  - { label: "Offset Y Factor (Множитель высоты объекта для позиции)", name: "followOffsetYFactor", widget: "number" }

                  - label: "Scale (Масштаб)"
                    name: "scale"
                    widget: "object"
                    fields:
                      - { label: "Start (Начальный)", name: "start", widget: "number", step: 0.1 }
                      - { label: "End (Конечный)", name: "end", widget: "number", step: 0.1 }

                  - label: "Alpha (Прозрачность)"
                    name: "alpha"
                    widget: "object"
                    fields:
                      - { label: "Start (Начальная)", name: "start", widget: "number", step: 0.1, min: 0, max: 1 }
                      - { label: "End (Конечная)", name: "end", widget: "number", step: 0.1, min: 0, max: 1 }

                  - label: "Speed (Скорость разлета)"
                    name: "speed"
                    widget: "object"
                    fields:
                      - { label: "Min (Минимальная)", name: "min", widget: "number" }
                      - { label: "Max (Максимальная)", name: "max", widget: "number" }

                  - label: "Angle (Угол испускания в градусах)"
                    name: "angle"
                    widget: "object"
                    fields:
                      - { label: "Min", name: "min", widget: "number" }
                      - { label: "Max", name: "max", widget: "number" }

                  - label: "Rotation (Вращение самой частицы)"
                    name: "rotate"
                    widget: "object"
                    fields:
                      - { label: "Min angle", name: "min", widget: "number" }
                      - { label: "Max angle", name: "max", widget: "number" }

                  - { label: "Gravity Y (Сила тяжести: отрицательная тянет вверх)", name: "gravityY", widget: "number" }
                  - { label: "Quantity (Кол-во за один раз)", name: "quantity", widget: "number" }
                  - { label: "Lifespan (Время жизни мс)", name: "lifespan", widget: "number" }
                  - { label: "Frequency (Частота выпуска мс)", name: "frequency", widget: "number" }
                  - { label: "Tint Color (Цвет в формате числа, например 10518624)", name: "tint", widget: "number" }
                  - label: "Blend Mode (Режим смешивания)"
                    name: "blendMode"
                    widget: "select"
                    options: ["NORMAL", "ADD", "MULTIPLY", "SCREEN"]