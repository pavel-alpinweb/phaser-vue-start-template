<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playable Ad</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #00bfdf;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        #splash {
            position: fixed;
            inset: 0;
            z-index: 3;
            display: grid;
            place-items: center;
            color: #fff;
            font: 16px/1.4 sans-serif;
            background: #000;
        }

        #splash::before {
            width: 32px;
            height: 32px;
            content: "";
            border: 3px solid rgb(255 255 255 / 25%);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        #splash.is-ready {
            cursor: pointer;
            background: rgb(0 0 0 / 55%);
        }

        #splash.is-ready::before {
            display: none;
        }

        .tap-prompt {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
        }

        #splash.is-ready .tap-prompt {
            display: flex;
        }

        .tap-prompt svg {
            width: 88px;
            height: 88px;
            overflow: visible;
            animation: pointer-bob 1.8s ease-in-out infinite;
        }

        .health-bar {
            position: fixed;
            top: max(16px, env(safe-area-inset-top));
            left: 50%;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 10px;
            width: min(300px, calc(100% - 32px));
            height: 50px;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .health-bar__icon {
            flex: 0 0 50px;
            width: 50px;
            height: 50px;
            color: #95c11f;
            transition: color 0.3s linear;
        }

        .health-bar__fuel-bar-wrapper {
            display: flex;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .health-bar__fuel-bar {
            width: 100%;
            height: 50%;
            background: #95c11f;
            transition: width 0.3s linear, background-color 0.3s linear;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pointer-bob {
            0%, 100% { transform: translateY(-8px); }
            50% { transform: translateY(8px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .tap-prompt svg { animation: none; }
        }
    </style>
</head>
<body>
<div id="splash" role="status" aria-label="Loading">
    <div class="tap-prompt" aria-hidden="true">
        <svg viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M6.38.72V3.53l-.09.17A16.93,16.93,0,0,0,4.5,11.28h0a1.89,1.89,0,0,0,1.61,1.86l5,.7v6.57a1.89,1.89,0,0,0,2,1.86,1.94,1.94,0,0,0,1.71-2V10.09l1.3,1.3a2,2,0,0,0,1.4.58,2,2,0,0,0,1.41-.58,2,2,0,0,0,0-2.81l-5-5.05V.72"
                  fill="none" stroke="currentColor" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Tap to move</span>
    </div>
</div>
<div id="health-bar" class="health-bar" role="progressbar" aria-label="Player health" aria-valuemin="0">
    <svg class="health-bar__icon" viewBox="0 0 48.001 48.001" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <path fill="currentColor" d="M46.354 18.926h-4.4a18.1 18.1 0 0 0-1.676-4.026l3.115-3.117a1.65 1.65 0 0 0 0-2.326l-4.848-4.849a1.647 1.647 0 0 0-2.328 0l-3.115 3.117a18.12 18.12 0 0 0-4.027-1.675V1.648A1.646 1.646 0 0 0 27.429.002h-6.857a1.646 1.646 0 0 0-1.646 1.646v4.401a18.1 18.1 0 0 0-4.028 1.675l-3.116-3.117a1.645 1.645 0 0 0-2.327 0L4.606 9.456a1.645 1.645 0 0 0 0 2.326l3.116 3.12a18.1 18.1 0 0 0-1.676 4.025h-4.4A1.646 1.646 0 0 0 0 20.572v6.857c0 .909.735 1.646 1.646 1.646h4.401a18.1 18.1 0 0 0 1.676 4.024l-3.116 3.118a1.647 1.647 0 0 0 0 2.327l4.848 4.85a1.644 1.644 0 0 0 2.324 0l3.119-3.117a18.1 18.1 0 0 0 4.028 1.675v4.401c0 .91.737 1.646 1.646 1.646h6.858c.907 0 1.646-.735 1.646-1.646v-4.401a18.1 18.1 0 0 0 4.028-1.675l3.114 3.117a1.647 1.647 0 0 0 2.328 0l4.847-4.85a1.646 1.646 0 0 0 0-2.327l-3.115-3.116a18.1 18.1 0 0 0 1.677-4.024h4.401c.91 0 1.646-.737 1.646-1.646v-6.857a1.646 1.646 0 0 0-1.646-1.646ZM34.617 24.342c-.436 1.945-2.292 4.102-4.332 5.969v3.271a1.521 1.521 0 0 1-3.042 0v-.753A43.2 43.2 0 0 1 24.002 35.1s-.772-.485-1.903-1.289v2.707a1.216 1.216 0 0 1-2.432 0v-4.545c-.226-.181-.456-.367-.684-.56v2.267a1.521 1.521 0 0 1-3.042 0V28.54c-1.263-1.39-2.253-2.845-2.556-4.2a6.17 6.17 0 0 1 2.885-7.308 6.18 6.18 0 0 1 7.731 1.467 6.18 6.18 0 0 1 7.724-1.467 6.17 6.17 0 0 1 2.892 7.31Z" />
    </svg>
    <div class="health-bar__fuel-bar-wrapper">
        <div class="health-bar__fuel-bar"></div>
    </div>
</div>
<div id="game"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
